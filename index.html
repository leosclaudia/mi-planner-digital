/* Impresión de un día suelto de Semana.
   Antes había un constructor fijo por índice (0..6), armado con DIAS: al mirar 14 o 30 días,
   el botón de imprimir de cualquier día del 8 en adelante llamaba a algo que no existía.
   Ahora la clave lleva la fecha, así que funciona con cualquier vista. */
function buildPrintDiaHTML(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const f = new Date(y, m-1, d);
  return `<section class="p-section"><h2>${esc(rotuloDia(f).toUpperCase())}</h2>${pRichBlock('semana_'+iso)}</section>`;
}
const PRINT_ORDER = ['inicio','semana','habitos','finanzas','proyectos','objetivos','compras','turnos','comidas','notas'];

function printCover(){
  const today = new Date().toLocaleDateString(state.lang==='en'?'en-US':'es-AR', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  return `<div class="p-cover"><h1>${esc(t('portada_title1'))} ${esc(t('portada_title2'))}</h1><p>${esc(today)}</p></div>`;
}

/* Arma el documento completo (todas las secciones) para el botón de Más */
function buildPrintHTML(){
  const sections = PRINT_ORDER.map(key => PRINT_BUILDERS[key]()).join('');
  return `<div class="p-doc">${printCover()}${sections}</div>`;
}

/* Arma el documento de UNA sola sección, para el botón de imprimir de cada pantalla */
function buildPrintSectionHTML(screenKey){
  /* Días sueltos de Semana: la clave trae la fecha (dia_2026-08-17). */
  if (screenKey && screenKey.indexOf('dia_') === 0 && screenKey.length === 14){
    return `<div class="p-doc">${printCover()}${buildPrintDiaHTML(screenKey.slice(4))}</div>`;
  }
  const builder = PRINT_BUILDERS[screenKey];
  if (!builder) return buildPrintHTML();
  return `<div class="p-doc">${printCover()}${builder()}</div>`;
}

/* ---------- módulo de sincronización ---------- */
/* CADA clave (cada día, cada sección) se guarda en SU PROPIO documento de Firestore,
   en vez de compartir un único documento entre todos. Así cada uno tiene su propio
   límite de 1MB, y una foto en "Lunes" no compite por espacio con "Martes" o "Viernes". */
const SYNC_KEYS = ['inicio','semana','habitos','finanzas','proyectos','objetivos','compras','turnos','comidas','notas'];
/* 'board_*' se mantiene por compatibilidad: son tableros de la versión vieja que pueden
   seguir guardados en algún dispositivo. Se sincronizan para no perderlos, aunque la app
   ya no los muestre. */
function isSyncKey(k){ return SYNC_KEYS.includes(k) || k.indexOf('rich_') === 0 || k.indexOf('board_') === 0; }
/* 'migratedToDocs' es una marca local del navegador, no un dato del planner: nunca se sube. */

const Sync = {
  db: null,
  unsub: null,
  applyingRemote: false,
  pushTimers: {},
  /* Claves con un cambio local que todavía NO se confirmó en la nube.
     Mientras una clave esté acá, ninguna versión que llegue de la nube la puede pisar. */
  dirty: {},
  loadScript(src){
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('No se pudo cargar '+src));
      document.head.appendChild(s);
    });
  },
  async start(){
    if (!state.syncConfig) return;
    try{
      await this.loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await this.loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(state.syncConfig.firebaseConfig);
      this.db = firebase.firestore();
      const parentRef = this.db.collection('planners').doc(state.syncConfig.code);
      const dataCol = parentRef.collection('data');

      /* Migración de una sola vez: si existían datos en el documento viejo (compartido),
         los copiamos a documentos individuales para liberar espacio. */
      /* ESTE ERA EL BUG DE FONDO.
         Antes: this.migrated era una variable en memoria, así que se reseteaba en CADA arranque,
         y la migración volvía a copiar los campos viejos del documento padre encima de los datos
         actuales. Resultado: guardabas una foto, y al abrir la app de nuevo la nota volvía a la
         versión vieja. Ahora la migración corre una sola vez (queda anotado en el navegador),
         nunca pisa un documento que ya existe, y al terminar borra los campos viejos del padre. */
      if (!DB.get('migratedToDocs', false)){
        try{
          const oldDoc = await parentRef.get();
          if (oldDoc.exists){
            const oldData = oldDoc.data() || {};
            const keysToMigrate = Object.keys(oldData).filter(isSyncKey);
            if (keysToMigrate.length){
              const existing = await dataCol.get();
              const yaEstan = {};
              existing.forEach(doc => { yaEstan[doc.id] = true; });
              const faltantes = keysToMigrate.filter(k => !yaEstan[k]);
              if (faltantes.length){
                const batch = this.db.batch();
                faltantes.forEach(k => batch.set(dataCol.doc(k), { value: oldData[k] }, { merge: true }));
                await batch.commit();
              }
              /* Limpiamos los campos viejos del documento padre para que no puedan volver a pisar nada. */
              const borrado = {};
              keysToMigrate.forEach(k => { borrado[k] = firebase.firestore.FieldValue.delete(); });
              await parentRef.set(borrado, { merge: true });
            }
          }
          DB.set('migratedToDocs', true);
        }catch(migErr){ /* si falla, seguimos con la sincronización normal */ }
      }

      /* Todo lo que se editó antes de que Firebase terminara de cargar quedó en espera:
         ahora que hay conexión, lo mandamos. */
      this.flushPending();

      /* Si se acaba de restaurar una copia, mandamos todo a la nube antes de escuchar cambios. */
      if (DB.get('pendienteSubirTodo', false)){
        DB.set('pendienteSubirTodo', false);
        App.clavesDelPlanner().forEach(k => { if (isSyncKey(k)) this.push(k); });
      }

      this.unsub = dataCol.onSnapshot(snap => {
        this.applyingRemote = true;
        snap.docChanges().forEach(change => {
          if (change.type === 'removed') return;
          const k = change.doc.id;
          /* Si acá hay un cambio local sin subir (por ejemplo una foto recién insertada
             mientras Firebase todavía estaba cargando), la copia de la nube está vieja.
             Pisarla era lo que hacía "desaparecer" la imagen a los pocos segundos. */
          if (this.dirty[k]) return;
          const remote = change.doc.data();
          if (remote && remote.value !== undefined){
            state[k] = remote.value;
            DB.set(k, state[k]);
            /* getRich()/richBoxOnly leen de state.richContent[...], que se cachea en memoria
               apenas se abre un día por primera vez. Si no refrescamos también esa caché acá,
               un día que ya se haya abierto (como Lunes, que se abre solo al entrar) se queda
               mostrando y guardando la versión vieja, aunque llegue una más nueva de la nube. */
            if (k.indexOf('rich_') === 0){
              const richKey = k.slice(5);
              if (!state.richContent) state.richContent = {};
              state.richContent[richKey] = remote.value;
            }
            /* Misma lógica para los tableros: getBoard() cachea en state.boards, así que
               sin esto el tablero abierto seguiría mostrando la versión vieja. */
            if (k.indexOf('board_') === 0){
              if (!state.boards) state.boards = {};
              state.boards[k.slice(6)] = remote.value;
            }
          }
        });
        this.applyingRemote = false;
        state.syncStatus = 'Última sincronización: ' + new Date().toLocaleTimeString('es-AR');
        renderSeguro();
      }, err => {
        state.syncStatus = 'No se pudo conectar (revisá la config o tu conexión).';
        renderSeguro();
      });
    }catch(e){
      state.syncStatus = 'No se pudo cargar Firebase. Revisá tu conexión a internet.';
      renderSeguro();
    }
  },
  stop(){
    if (this.unsub) this.unsub();
    this.db = null;
  },
  push(key){
    if (this.applyingRemote || !key) return;
    /* Antes, si Firebase todavía no había terminado de cargar (this.db === null), este push
       se descartaba en silencio y el cambio no se subía nunca. Ahora se anota como pendiente
       y se manda apenas hay conexión. */
    this.dirty[key] = true;
    clearTimeout(this.pushTimers[key]);
    this.pushTimers[key] = setTimeout(() => this.flushKey(key), 500);
  },
  flushKey(key){
    if (!this.db || !state.syncConfig) return;   // sigue pendiente; se manda al conectar
    /* Para las claves de texto enriquecido (imágenes incluidas), el contenido real y actualizado
       vive en state.richContent[...], no en state[key] directamente — ahí es donde hay que leerlo
       antes de subirlo, o se termina mandando una copia vieja o vacía. */
    let value;
    if (key.indexOf('rich_') === 0){
      const rk = key.slice(5);
      value = (state.richContent && state.richContent[rk] !== undefined)
        ? state.richContent[rk]
        : DB.get(key, undefined);
    } else if (key.indexOf('board_') === 0){
      /* Los tableros viven en state.boards, que getBoard() cachea recién al abrirlos.
         Si todavía no se abrió en esta sesión, lo leemos del navegador. */
      const bk = key.slice(6);
      value = (state.boards && state.boards[bk] !== undefined)
        ? state.boards[bk]
        : DB.get(key, undefined);
    } else {
      value = (state[key] !== undefined) ? state[key] : DB.get(key, undefined);
    }
    if (value === undefined) return;
    const dataCol = this.db.collection('planners').doc(state.syncConfig.code).collection('data');
    dataCol.doc(key).set({ value }, { merge: true })
      .then(() => {
        delete this.dirty[key];
        state.syncStatus = 'Última sincronización: ' + new Date().toLocaleTimeString('es-AR');
        renderSeguro();
      })
      .catch(err => {
        const msg = (err && err.message) ? err.message : String(err);
        /* Queda en dirty a propósito: así la copia local no se pisa y se reintenta al reconectar. */
        state.syncStatus = 'Sin subir "' + key + '": ' + msg;
        renderSeguro();
      });
  },
  flushPending(){
    Object.keys(this.dirty).forEach(k => this.flushKey(k));
  }
};

/* engancha cada guardado local con un push a Firebase, si está conectado */
const _dbSet = DB.set.bind(DB);
DB.set = (key, value) => { _dbSet(key, value); if (isSyncKey(key)) Sync.push(key); };

/* revisa recordatorios de turnos cada 30s (mientras la app está abierta) */
function checkReminders(){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  (state.turnos.lista||[]).forEach(item => {
    if (!item.recordar || item.notified || !item.fecha || !item.hora) return;
    const when = new Date(`${item.fecha}T${item.hora}`);
    if (when <= now && when > new Date(now - 15*60*1000)){
      new Notification(item.titulo || 'Turno', { body: `Hoy ${item.hora} — ${item.notas||'no te olvides'}` });
      item.notified = true;
      DB.set('turnos', state.turnos);
    }
  });
}
setInterval(checkReminders, 30000);

/* ---------- arrastrar imágenes a mano ----------
   Los eventos van sobre document (no sobre cada imagen) porque render() rehace el HTML
   a cada rato: si se engancharan a la imagen, se perderían en el primer redibujado.
   'pointer' cubre mouse, dedo y lápiz óptico con el mismo código. */
/* Dibuja el marco con las manijas de las esquinas sobre la imagen seleccionada.
   Es solo visual (pointer-events:none): los toques los sigue manejando la imagen. */
function borrarMarco(){
  document.querySelectorAll('.rt-marco').forEach(m => m.remove());
}
function dibujarMarco(img){
  borrarMarco();
  const caja = img && img.closest('.richbox');
  if (!caja) return;
  const m = document.createElement('div');
  m.className = 'rt-marco';
  m.innerHTML = '<i class="nw"></i><i class="ne"></i><i class="sw"></i><i class="se"></i>';
  caja.appendChild(m);
  ubicarMarco(img);
}
function ubicarMarco(img){
  const m = document.querySelector('.rt-marco');
  const caja = img && img.closest('.richbox');
  if (!m || !caja) return;
  const a = img.getBoundingClientRect(), b = caja.getBoundingClientRect();
  m.style.left   = (a.left - b.left) + 'px';
  m.style.top    = (a.top  - b.top)  + 'px';
  m.style.width  = a.width  + 'px';
  m.style.height = a.height + 'px';
}

/* ---------- mover y redimensionar imágenes a mano ----------
   Los eventos van sobre document (no sobre cada imagen) porque render() rehace el HTML
   a cada rato: si se engancharan a la imagen, se perderían en el primer redibujado.
   'pointer' cubre mouse, dedo y lápiz óptico con el mismo código. */
/* Ancho contra el que el navegador resuelve un 'left' en porcentaje: es el ancho
   INTERNO del contenedor (sin sus márgenes internos), no el que devuelve
   getBoundingClientRect. Usar el equivocado corría la imagen unos píxeles cada vez. */
function anchoInterno(caja){
  if (!caja) return 300;
  const cs = getComputedStyle(caja);
  const w = caja.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  return w > 0 ? w : (caja.getBoundingClientRect().width || 300);
}

(function initArrastreImagenes(){
  let img = null, modo = null, x0 = 0, y0 = 0, ix = 0, iy = 0, w0 = 0;
  let dx = 0, dy = 0, movio = false, pedido = null, esquina = null;
  let topeIzq = 0, topeDer = 0, topeArr = 0, topeAba = 0;
  const num = v => parseFloat(v) || 0;
  const ESQUINA = 30;   // zona de las esquinas, en píxeles

  /* Devuelve cuál de las 4 esquinas se tocó ('br','bl','tr','tl') o null si no fue en ninguna. */
  function queEsquina(el, ev){
    const r = el.getBoundingClientRect();
    const cerca_der = ev.clientX > r.right - ESQUINA;
    const cerca_izq = ev.clientX < r.left + ESQUINA;
    const cerca_aba = ev.clientY > r.bottom - ESQUINA;
    const cerca_arr = ev.clientY < r.top + ESQUINA;
    if (cerca_der && cerca_aba) return 'br';
    if (cerca_izq && cerca_aba) return 'bl';
    if (cerca_der && cerca_arr) return 'tr';
    if (cerca_izq && cerca_arr) return 'tl';
    return null;
  }
  function enEsquina(el, ev){ return !!queEsquina(el, ev); }

  /* Un solo repintado por cuadro de video: sin esto el arrastre se siente pesado
     porque el navegador recalcula el diseño en cada evento del dedo. */
  function pintar(){
    pedido = null;
    if (!img) return;
    if (modo === 'estirar'){
      /* Si la esquina agarrada está del lado izquierdo, arrastrar hacia la izquierda debe
         AGRANDAR la imagen (dx negativo suma ancho); del lado derecho es al revés, como antes. */
      const signo = (esquina === 'bl' || esquina === 'tl') ? -1 : 1;
      const tope = Math.min(1600, Math.round(w0 + (signo===1?topeDer:-topeIzq)));
      const nuevo = Math.max(60, Math.min(Math.round(w0 + signo*dx), tope));
      img.style.width = nuevo + 'px';
      img.style.height = 'auto';
      /* Si la imagen está en posición libre y se agarró del lado izquierdo, hay que correr
         el borde izquierdo para que el lado derecho quede fijo (si no, "flota" para el lado
         que no corresponde). */
      if (img.classList.contains('rt-libre') && (esquina === 'bl' || esquina === 'tl')){
        img.style.left = (ix - (nuevo - w0)) + 'px';
      }
    } else {
      /* No dejamos que se escape del recuadro: quedaría flotando sobre la tarjeta. */
      const mx = Math.max(topeIzq, Math.min(dx, topeDer));
      const my = Math.max(topeArr, Math.min(dy, topeAba));
      img.style.transform = `translate(${mx}px, ${my}px)`;
    }
    ubicarMarco(img);
  }

  document.addEventListener('pointerdown', ev => {
    const el = ev.target;
    if (!el || el.tagName !== 'IMG' || !el.closest('.richtext')) return;
    if (!el.classList.contains('rt-img-selected')) return;   // primero se toca para seleccionar

    esquina = queEsquina(el, ev);
    modo = esquina ? 'estirar' : 'mover';
    /* Medimos ANTES de tocar las clases: al quitarle el tope de miniatura la imagen
       saltaba a su tamaño original y el estirado arrancaba de un ancho equivocado. */
    const r = el.getBoundingClientRect();
    const c = el.closest('.richtext').getBoundingClientRect();
    w0 = r.width;
    if (modo === 'mover'){
      /* Una imagen seleccionada se mueve directamente: no hace falta activar nada antes. */
      ['rt-izq','rt-der','rt-flota-izq','rt-flota-der'].forEach(c => el.classList.remove(c));
      /* Si la posición había quedado guardada en % (para adaptarse a cada pantalla), la
         convertimos a píxeles reales de ESTA pantalla antes de arrastrar — así el arrastre
         arranca del lugar correcto y no de un número tomado de otra pantalla. */
      const anchoRef = anchoInterno(el.closest('.richtext'));
      if (el.style.left && el.style.left.indexOf('%') !== -1) el.style.left = Math.round(parseFloat(el.style.left)/100 * anchoRef) + 'px';
      /* Compatibilidad: las notas viejas pueden tener el 'top' guardado en %; lo pasamos a píxeles. */
      if (el.style.top && el.style.top.indexOf('%') !== -1) el.style.top = Math.round(parseFloat(el.style.top)/100 * anchoRef) + 'px';
      if (!el.style.left) el.style.left = '0px';
      if (!el.style.top)  el.style.top  = '0px';
      el.classList.add('rt-libre');
      el.setAttribute('draggable','false');
      /* El modo libre anula el 'margin:auto' que centraba la imagen, así que al agarrarla
         daba un salto hacia la izquierda. Acá medimos ese corrimiento y lo compensamos,
         para que la imagen arranque exactamente donde estaba. */
      const desp = el.getBoundingClientRect();
      const salto = { x: desp.left - r.left, y: desp.top - r.top };
      if (salto.x || salto.y){
        el.style.left = (num(el.style.left) - salto.x) + 'px';
        el.style.top  = (num(el.style.top)  - salto.y) + 'px';
      }
    } else {
      /* Fijamos el ancho actual en el mismo momento en que se quita el tope,
         así no hay ningún salto visible. */
      el.style.width = Math.round(w0) + 'px';
      el.style.height = 'auto';
      el.classList.add('rt-medida');
      el.classList.remove('rt-img-big');
    }

    img = el; movio = false; dx = 0; dy = 0;
    x0 = ev.clientX; y0 = ev.clientY;
    ix = num(el.style.left); iy = num(el.style.top);   // ya compensado el salto de arriba
    topeIzq = c.left + 4 - r.left;   topeDer = c.right - 4 - r.right;
    topeArr = c.top  + 4 - r.top;    topeAba = c.bottom - 4 - r.bottom;
    if (topeDer < topeIzq) topeDer = topeIzq;
    if (topeAba < topeArr) topeAba = topeArr;
    el.classList.add(modo === 'estirar' ? 'rt-estirando' : 'rt-agarrada');
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  }, true);

  document.addEventListener('pointermove', ev => {
    if (!img){
      const el = ev.target;
      if (el && el.tagName === 'IMG' && el.classList.contains('rt-img-selected') && el.closest('.richtext')){
        el.style.cursor = enEsquina(el, ev) ? 'nwse-resize' : 'grab';
      }
      return;
    }
    dx = ev.clientX - x0;
    dy = ev.clientY - y0;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) movio = true;
    if (!pedido) pedido = requestAnimationFrame(pintar);
    ev.preventDefault();
  });

  function soltar(){
    if (!img) return;
    if (pedido){ cancelAnimationFrame(pedido); pedido = null; }
    const caja = img.closest('.richtext');
    const contW = anchoInterno(caja);
    if (modo === 'mover' && movio){
      /* Pasamos el desplazamiento temporal a la posición definitiva, ya recortado. */
      const mx = Math.max(topeIzq, Math.min(dx, topeDer));
      const my = Math.max(topeArr, Math.min(dy, topeAba));
      img.style.transform = '';
      /* El corrimiento horizontal va en % del ancho del cuadro, para que en una pantalla
         más angosta (el celu) la imagen caiga en el lugar proporcional correcto.
         El vertical va en píxeles: un 'top' en porcentaje CSS lo calcula contra la ALTURA
         del contenedor, que acá depende del contenido, y el navegador lo tomaba como cero.
         Ese era el motivo de que la imagen no se pudiera mover ni para arriba ni para abajo. */
      img.style.left = (((ix + mx) / contW) * 100) + '%';
      img.style.top  = (iy + my) + 'px';
    } else if (modo === 'estirar' && movio){
      const wPx = num(img.style.width);
      const pct = Math.max(8, Math.min(100, (wPx / contW) * 100));
      img.style.width = pct + '%';
      if (img.classList.contains('rt-libre') && (esquina === 'bl' || esquina === 'tl')){
        img.style.left = ((num(img.style.left) / contW) * 100) + '%';
      }
      img.style.transform = '';
    } else {
      img.style.transform = '';
    }
    img.classList.remove('rt-agarrada','rt-estirando');
    const guardar = movio;
    ubicarMarco(img);
    const el = img;
    img = null; modo = null;
    if (guardar && caja && caja.dataset.key) RichText.persist(caja.dataset.key);
    else if (!guardar) RichText.selectImage(null, el);
  }
  document.addEventListener('pointerup', soltar);
  document.addEventListener('pointercancel', soltar);

  /* Si cambia el tamaño de la ventana, el marco tiene que seguir a la imagen. */
  window.addEventListener('resize', () => { if (richSelectedImage) ubicarMarco(richSelectedImage); });
})();

document.documentElement.lang = state.lang;
window.addEventListener('afterprint', () => {
  const el = document.getElementById('printArea');
  if (el) el.remove();
});
render();
if (state.syncConfig) Sync.start();


/* ---------- service worker ---------- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
