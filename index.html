<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F1; --card:#FFFDFC; --ink:#65475F; --sub:#6E7772;
    --mint:#DDE9DF; --mintLine:#AFC8B7; --terracota:#F2DFD6; --terracotaLine:#D9B3A3;
    --accent:#9B7A94;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  svg{width:16px;height:16px;display:block;flex-shrink:0;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;}
  h1,h2,h3{font-family:'Lora',serif;margin:0;font-weight:700;}
  #app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);}
  header.top{padding:18px 20px 10px;flex-shrink:0;}
  header.top h1{font-size:24px;font-weight:700;}
  header.top p{font-size:13px;color:var(--sub);margin-top:4px;}
  header.top .rule{height:1px;background:var(--mintLine);opacity:.6;margin-top:12px;}
  .backrow{display:flex;align-items:center;gap:2px;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:2px;}
  .backrow svg{width:14px;height:14px;}
  main{flex:1;overflow-y:auto;padding:0 20px 20px;}
  .card{background:var(--card);border:1px solid var(--mintLine);border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 6px rgba(85,72,65,.05), 0 8px 20px rgba(85,72,65,.06);}
  .card.terracota{border-color:var(--terracotaLine);}
  .card-h{padding:10px 16px;background:var(--mint);font-size:11px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card.terracota .card-h{background:var(--terracota);}
  .card-b{padding:14px 16px;}
  textarea,input[type=text],input[type=number]{
    width:100%;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;color:var(--ink);
  }
  textarea{resize:none;line-height:1.5;}
  /* El campo de fecha del navegador viene con su propio recuadro cuadrado y su tipografía,
     y desentonaba con el resto. Lo vestimos como una pastilla, igual que los demás controles. */
  input[type=date], input[type=time]{
    -webkit-appearance:none;appearance:none;
    border:none;outline:none;cursor:pointer;
    background:var(--mint);color:var(--ink);
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:5px 10px;border-radius:999px;width:auto;max-width:100%;
  }
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer;margin-left:2px;}
  input[type=date]::-webkit-inner-spin-button, input[type=time]::-webkit-inner-spin-button,
  input[type=date]::-webkit-clear-button, input[type=time]::-webkit-clear-button{display:none;}
  /* No aplica a los selectores invisibles (el 📅 de Semana y el ↪ de mover). */
  input[type=time]{background:var(--terracota);}
  .fechapick input[type=date]{background:transparent;padding:0;border-radius:0;}
  input::placeholder,textarea::placeholder{color:#C9C2B4;}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .row:last-child{margin-bottom:0;}
  .chk{width:20px;height:20px;flex-shrink:0;border-radius:6px;border:1px solid var(--terracotaLine);display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;}
  .chk.done{background:var(--accent);border-color:var(--accent);}
  .chk svg{width:12px;height:12px;}
  .xbtn{background:none;border:none;color:var(--sub);cursor:pointer;padding:4px;flex-shrink:0;}
  .addlink{background:none;border:none;color:var(--accent);font-size:13px;font-weight:500;display:flex;align-items:center;gap:5px;cursor:pointer;padding:4px 0;white-space:nowrap;}
  .addlink svg{flex-shrink:0;width:14px;height:14px;}
  .dashedbtn{width:100%;padding:12px;border-radius:16px;border:1px dashed var(--mintLine);background:none;color:var(--accent);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;margin-top:2px;}
  .richimgbtn{width:auto;padding:6px 10px;border-radius:10px;border:1px solid var(--mintLine);background:#fff;color:var(--accent);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;cursor:pointer;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid2 .card-expanded{grid-column:1 / -1;}
  .grid4menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;}
  .menuitem{background:var(--card);border:1px solid var(--mintLine);border-radius:16px;padding:18px 14px;text-align:left;cursor:pointer;}
  .menuitem b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px;}
  .menuitem span{font-size:11.5px;color:var(--sub);}
  .dollar-row{display:flex;align-items:baseline;gap:8px;}
  .dollar-row span{font-size:20px;font-weight:700;color:var(--ink);}
  .dollar-row input{border-bottom:1px solid var(--mintLine);padding-bottom:4px;font-size:16px;}
  .mov-row{display:grid;grid-template-columns:1fr 1.4fr 0.8fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #F1EEE6;font-size:12.5px;}
  .mov-row input{font-size:12.5px;}
  .tabbar{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--mintLine);}
  .tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);cursor:pointer;padding:4px 8px;}
  .tab.active{color:var(--ink);font-weight:600;}
  .tab svg{width:20px;height:20px;}
  .tab span{font-size:10px;}
  .habit-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .habit-day.esHoy{border-color:var(--ink);border-width:2px;font-weight:700;color:var(--ink);}
  .habit-day{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:1px solid var(--mintLine);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);background:none;cursor:pointer;}
  .habit-day.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .habit-name{width:100%;font-weight:600;font-size:14px;border:none;background:transparent;outline:none;color:var(--ink);}
  .menuitem{}
  .btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.ghost{background:none;color:var(--sub);}
  ::-webkit-scrollbar{display:none;}

  .portada{position:relative;height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden;}
  .blob{position:absolute;border-radius:50%;background:var(--mint);}
  .blob-a{width:150px;height:150px;top:-40px;left:-50px;}
  .blob-b{width:60px;height:60px;top:95px;left:65px;opacity:.8;}
  .blob-c{width:130px;height:130px;bottom:-30px;right:-40px;background:var(--terracota);}
  .portada-card{position:relative;z-index:1;background:var(--card);border:1px solid var(--mintLine);border-radius:28px;padding:44px 30px;text-align:center;}
  .portada-card h1{font-size:28px;line-height:1.15;color:var(--ink);}
  .portada-card .tagline{font-family:'Lora',serif;font-style:italic;font-weight:600;color:#D98F75;font-size:17px;margin-top:8px;}
  .rule2{height:1px;background:var(--mintLine);opacity:.7;margin:18px auto;width:70%;}
  .portada-card .desc{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:22px;}
  .startbtn{background:var(--mint);border:none;color:var(--ink);font-weight:700;font-size:12.5px;letter-spacing:.03em;padding:14px 22px;border-radius:14px;cursor:pointer;}
  .notifbanner{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--terracota);border:1px solid var(--terracotaLine);color:var(--ink);font-size:12.5px;font-weight:600;padding:10px;border-radius:14px;margin-bottom:12px;cursor:pointer;}
  .bellbtn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--mintLine);color:var(--sub);font-size:12px;font-weight:600;padding:7px 12px;border-radius:20px;margin-top:10px;cursor:pointer;}
  .bellbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}


  /* ---------- sistema de texto enriquecido (Notas, Inicio) ---------- */
  .richtoolbar{position:sticky;top:0;z-index:40;background:var(--bg);padding:10px 20px 8px;margin:0 -20px 6px;border-bottom:1px solid var(--mintLine);}
  .richtoolbar-row{display:flex;justify-content:space-between;align-items:center;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .richtoolbar-group{display:flex;gap:5px;flex-shrink:0;}
  .richbtn{width:34px;height:34px;border-radius:11px;border:1px solid var(--mintLine);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex-shrink:0;}
  .richbtn svg{width:15px;height:15px;}
  .richbtn.active{background:var(--terracota);border-color:var(--terracotaLine);}
  .richpanel{margin-top:8px;background:var(--card);border:1px solid var(--mintLine);border-radius:14px;padding:12px;}
  .richpanel-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .richpanel-row:last-child{margin-bottom:0;}
  .richpanel select{height:38px;border:1px solid var(--mintLine);border-radius:10px;padding:0 8px;font-size:13px;background:var(--bg);flex:1;min-width:0;}
  .richswatch{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--mintLine);cursor:pointer;flex-shrink:0;}
  .richswatch.square{border-radius:8px;}
  .richlabel{font-size:11px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:5px;width:100%;margin-bottom:2px;}
  .richstickergrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:220px;overflow-y:auto;margin-bottom:8px;}
  .richstickergrid button{background:#fff;border:1px solid var(--mintLine);border-radius:10px;height:44px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .richediting{font-size:11px;color:var(--sub);margin-top:6px;}
  /* --- Semana en pantalla ancha: grilla de tarjetas ---
     En el celular queda todo igual (una columna). Desde 900px la app se ensancha y los
     7 días se acomodan en columnas, así la tarjeta abierta deja de quedar larguísima. */
  .semana-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .semana-nav-mid{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);}
  .semnavbtn{background:var(--card);border:1px solid var(--mintLine);border-radius:10px;width:34px;height:34px;font-size:19px;line-height:1;color:var(--ink);cursor:pointer;flex-shrink:0;}
  .semhoybtn{background:transparent;border:1px solid var(--mintLine);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--sub);cursor:pointer;}
  /* El input de fecha va transparente encima del ícono: así se abre el selector
     nativo del sistema (la rueda del celular), igual que al poner una alarma. */
  .fechapick{position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border:1px solid var(--mintLine);border-radius:9px;background:var(--card);
    font-size:14px;cursor:pointer;flex-shrink:0;}
  .fechapick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;}
  .movepick{width:26px;height:26px;font-size:13px;}
  .ordbtns{display:flex;gap:0;flex-shrink:0;}
  .ordbtns button{background:none;border:none;font-size:12px;cursor:pointer;padding:2px 3px;line-height:1;}
  .ordbtns button:disabled{opacity:.2;cursor:default;}
  .limpiarbtn{width:100%;margin-top:10px;background:none;border:1px dashed var(--mintLine);border-radius:12px;
    padding:8px;font-size:12.5px;color:var(--sub);cursor:pointer;}
  .habitnum{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .habitmover{display:flex;gap:1px;flex-shrink:0;}
  .habitmover button{background:none;border:none;font-size:13px;cursor:pointer;padding:2px 3px;line-height:1;}
  .habitmover button:disabled{opacity:.22;cursor:default;}
  .habitcard{transition:opacity .15s;}
  .habitcard.arrastrando{opacity:.4;}
  .habitcard.sobre{outline:2px dashed var(--accent);outline-offset:2px;}
  .notas-grid{display:grid;gap:12px;align-items:start;}
  @media (min-width:620px){ .notas-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (min-width:1000px){ .notas-grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  .notas-grid .card{margin-bottom:0;}
  .notacard{transition:opacity .15s,transform .15s;}
  .notacard.arrastrando{opacity:.4;}
  .notacard.sobre{outline:2px dashed var(--accent);outline-offset:2px;}
  .notamover{display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:6px 12px 10px;border-top:1px solid var(--mintLine);}
  .notamover button{background:none;border:none;font-size:15px;cursor:pointer;padding:2px 8px;line-height:1;}
  .notamover button:disabled{opacity:.22;cursor:default;}
  .notagarra{color:var(--sub);font-size:15px;letter-spacing:1px;cursor:grab;}
  .avisoguardado{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:7px 15px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:8000;}
  .avisoguardado.visible{opacity:.94;transform:translateX(-50%) translateY(0);}
  .resultado{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--mintLine);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;}
  .res-zona{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--sub);}
  .res-frag{font-size:13px;line-height:1.5;color:var(--ink);}
  .vista-sel{display:flex;gap:6px;justify-content:center;margin:-6px 0 14px;}
  .vistabtn{background:var(--card);border:1px solid var(--mintLine);border-radius:999px;padding:5px 14px;font-size:12px;color:var(--sub);cursor:pointer;}
  .vistabtn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}
  .card.dia-hoy{border-color:var(--accent);box-shadow:0 0 0 2px rgba(155,122,148,.22);}
  .semana-grid{display:grid;gap:14px;align-items:start;}
  .semana-grid .card{margin-bottom:0;}
  @media (min-width:620px){
    #app{max-width:1080px;}
    main{padding:0 24px 24px;}
    .semana-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (min-width:1000px){
    .semana-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .semana-grid .card.dia-abierto{grid-column:span 2;}
  }
  .richbox{position:relative;min-height:110px;}
  .richtext{position:relative;z-index:10;min-height:110px;padding:14px 16px;font-size:14px;line-height:1.6;color:var(--ink);outline:none;}
  .richtext:empty:before{content:attr(data-placeholder);color:#C9C2B4;}
  .richink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .richink.active{z-index:20;cursor:crosshair;}
  .richink:not(.active){pointer-events:none;z-index:0;}
  /* Las fotos verticales estiraban la tarjeta del día a lo largo y tapaban el texto.
     Ahora se muestran chicas (miniatura); con el botón "Ver grande" se abren a pantalla completa. */
  .richtext img{box-sizing:border-box;max-width:70%;max-height:180px;width:auto;height:auto;object-fit:contain;display:block;margin:8px auto;border-radius:10px;box-shadow:0 3px 10px rgba(85,72,65,.12);cursor:pointer;border:2px solid transparent;}
  .richtext img.rt-img-big{max-width:100%;max-height:none;}
  /* El 'margin:8px auto' de arriba centra la imagen siempre. Estas clases permiten
     moverla: pegada a la izquierda, a la derecha, o con el texto al lado. */
  .richtext img.rt-izq{margin:8px auto 8px 0;}
  .richtext img.rt-der{margin:8px 0 8px auto;}
  .richtext img.rt-flota-izq{float:left;margin:4px 14px 8px 0;max-width:45%;}
  .richtext img.rt-flota-der{float:right;margin:4px 0 8px 14px;max-width:45%;}
  /* Modo libre: la imagen se puede arrastrar con el mouse o el lápiz a cualquier lado.
     Usa position:relative (no absolute) a propósito: así sigue ocupando su lugar y el
     recuadro crece con ella, en vez de quedarse chico y tapar el texto. */
  /* Un respiro al final de cada recuadro: sin esto el cuadro se ajusta justo al contenido
     y una imagen no tiene margen para moverse hacia arriba o hacia abajo. */
  .richtext{padding-bottom:70px;}
  .richtext img.rt-libre{position:relative;margin:0 !important;cursor:grab;touch-action:none;
    -webkit-user-drag:none;user-select:none;z-index:3;}
  .richtext img.rt-libre.rt-agarrada{cursor:grabbing;opacity:.85;box-shadow:0 8px 22px rgba(85,72,65,.3);}
  /* Medida a mano: cuando la persona estira la imagen, su ancho manda por sobre los
     topes de la miniatura. Sin esto el max-width la volvería a achicar sola. */
  .richtext img.rt-medida{max-width:100% !important;max-height:none !important;height:auto;}
  .richtext img.rt-estirando{opacity:.9;}
  /* Mientras se arrastra usamos transform (lo mueve la placa de video, no el navegador
     rehaciendo el diseño), y avisamos con will-change. Antes se movía con left/top en
     cada movimiento del dedo y por eso iba a los tirones. */
  .richtext img.rt-agarrada,.richtext img.rt-estirando{will-change:transform,width;box-shadow:0 10px 26px rgba(85,72,65,.28);}
  /* Marco de selección: solo visual, no recibe toques (los maneja la imagen). */
  .rt-marco{position:absolute;border:1.5px solid var(--accent);border-radius:8px;
    pointer-events:none;z-index:9;box-sizing:border-box;}
  .rt-marco i{position:absolute;width:13px;height:13px;background:#fff;
    border:2.5px solid var(--accent);border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .rt-marco i.nw{left:-7px;top:-7px;}
  .rt-marco i.ne{right:-7px;top:-7px;}
  .rt-marco i.sw{left:-7px;bottom:-7px;}
  .rt-marco i.se{right:-7px;bottom:-7px;background:var(--accent);width:16px;height:16px;
    border-color:#fff;bottom:-9px;right:-9px;}
  /* Sin esto, el recuadro se "achica" detrás de una imagen flotante. */
  .richtext::after{content:'';display:block;clear:both;}
  .imgviewer{position:fixed;inset:0;background:rgba(30,25,22,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
  .imgviewer img{max-width:100%;max-height:86vh;border-radius:10px;}
  .imgviewer button{position:absolute;top:14px;right:16px;background:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer;}
  .richtext img.rt-img-selected{border-color:transparent;}
  .pzel.selected{outline:1.5px dashed var(--accent);}
  .pzhandle.ne{top:-8px;right:-8px;cursor:nesw-resize;}
  .pzhandle.sw{bottom:-8px;left:-8px;cursor:nesw-resize;}
  .pzhandle.se{bottom:-8px;right:-8px;cursor:nwse-resize;}

  .pztool.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pzswatch.active{border-color:var(--ink);}
  .card-h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .langtoggle{flex-shrink:0;display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--mintLine);border-radius:20px;padding:3px;gap:2px;margin-top:2px;}
  .langtoggle-seg{border:none;background:none;color:var(--sub);font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:6px 13px;border-radius:16px;cursor:pointer;}
  .langtoggle-seg.active{background:var(--ink);color:#fff;}
  .portada-lang{position:absolute;top:20px;right:20px;z-index:2;}
  .printbtn{flex-shrink:0;background:var(--card);border:1px solid var(--mintLine);color:var(--ink);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;}

  .card-h-printbtn svg{width:15px;height:15px;}
  /* La flechita que abre/cierra cada día nunca había tenido regla propia: heredaba un tamaño
     al azar. Ahora queda igual que el resto de los íconos del encabezado. */
  .daychevron{opacity:.6;}
  .daychevron svg{width:15px;height:15px;}
  .card-h-printbtn:hover{opacity:1;}

  /* ---------- vista de impresión / exportación ---------- */
  #printArea{display:none;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
    .p-doc{font-family:'Inter',system-ui,sans-serif;color:#65475F;max-width:100%;}
    .p-cover{text-align:center;padding:20px 0 24px;border-bottom:2px solid #65475F;margin-bottom:18px;}
    .p-cover h1{font-family:'Lora',serif;font-size:26px;margin:0 0 6px;}
    .p-cover p{font-size:13px;color:#6E7772;margin:0;text-transform:capitalize;}
    .p-section{page-break-inside:avoid;margin-bottom:22px;}
    .p-section h2{font-family:'Lora',serif;font-size:18px;background:#EADFE7;padding:6px 10px;border-radius:6px;margin:0 0 10px;}
    .p-section h3{font-size:13px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em;color:#65475F;}
    .p-sub{font-size:12.5px;margin:2px 0 6px;}
    .p-empty{font-size:12px;color:#999;margin:2px 0 8px;}

    .p-rich img{max-width:200px;height:auto;}
    .p-drawing{max-width:100%;max-height:220px;border:1px solid #DDE9DF;border-radius:6px;margin-bottom:8px;}
    .p-checklist{list-style:none;padding:0;margin:0 0 8px;font-size:12.5px;}
    .p-checklist li{padding:2px 0;}
    .p-checklist li.p-done{color:#999;text-decoration:line-through;}
    .p-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px;}
    .p-table th,.p-table td{border:1px solid #DDE9DF;padding:4px 8px;text-align:left;}
    .p-subcard{border:1px solid #DDE9DF;border-radius:8px;padding:10px 12px;margin-bottom:10px;page-break-inside:avoid;}
    @page{margin:16mm;}
  }
  img.emoji{height:1.4em;width:1.4em;vertical-align:-0.3em;}

  get(key, fallback){
    try{ const v = localStorage.getItem('planner:'+key); return v ? JSON.parse(v) : fallback; }

  set(key, value){
    try{ localStorage.setItem('planner:'+key, JSON.stringify(value)); }
    catch(e){
      /* Antes acá había un catch vacío: si el navegador se quedaba sin espacio, el guardado
         fallaba en silencio y la imagen "desaparecía" sola en el siguiente render. */
      alert('No se pudo guardar "'+key+'".\n\nMotivo: '+((e && e.name) ? e.name : e)+'\n\nCasi seguro es falta de espacio: las imágenes ocupan mucho.');

/* Redibujado que NO interrumpe a quien está escribiendo.
   La sincronización redibuja la pantalla cada vez que confirma un guardado, y eso
   destruía el casillero donde estabas tipeando: entraban dos o tres letras y se cortaba.
   Ahora, si hay un campo con el foco puesto, el redibujado espera a que lo sueltes. */
let renderPendiente = false;
function escribiendoAhora(){
  const a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable));
}
function renderSeguro(){
  if (escribiendoAhora()){ renderPendiente = true; return; }
  render();
}
document.addEventListener('focusout', () => {
  if (!renderPendiente) return;
  /* Damos un respiro por si el foco solo saltó de un campo a otro. */
  setTimeout(() => {
    if (renderPendiente && !escribiendoAhora()){ renderPendiente = false; render(); }
  }, 150);
});

function render(){
  /* Si hay un campo de texto con foco (por ej. escribiendo un título) y llega una
     sincronización de fondo, el redibujado completo de la pantalla lo hacía perder
     el foco y el cursor, cortando lo que se estaba escribiendo. Lo guardamos acá
     y lo restauramos al final. */
  const focoPrevio = document.activeElement;
  let focoInfo = null;
  if (focoPrevio && focoPrevio.id && (focoPrevio.tagName === 'INPUT' || focoPrevio.tagName === 'TEXTAREA')){
    focoInfo = { id: focoPrevio.id, start: focoPrevio.selectionStart, end: focoPrevio.selectionEnd };
  }
  const app = document.getElementById('app');
  const titles = {
    inicio:[t('title_inicio'), t('sub_inicio')],
    semana:[t('title_semana'), t('sub_semana')],
    habitos:[t('title_habitos'), t('sub_habitos')],
    mas:[t('title_mas'), t('sub_mas')],
    finanzas:[t('title_finanzas'), t('sub_finanzas')],
    proyectos:[t('title_proyectos'), t('sub_proyectos')],
    notas:[t('title_notas'), t('sub_notas')],
    objetivos:[t('title_objetivos'), t('sub_objetivos')],
    compras:[t('title_compras'), t('sub_compras')],
    turnos:[t('title_turnos'), t('sub_turnos')],
    comidas:[t('title_comidas'), t('sub_comidas')],
    sync:[t('title_sync'), t('sub_sync')],
    buscar:['Buscar', 'Encontrá cualquier cosa que hayas escrito'],
  };
  let screenKey = state.tab === 'mas' && state.masScreen ? state.masScreen : state.tab;

  if (screenKey === 'portada'){
    app.innerHTML = renderPortada();
    return;
  }

  let [title, subtitle] = titles[screenKey];
  let backRow = '';
  if (state.tab === 'mas' && state.masScreen){
    backRow = `<div class="backrow" onclick="App.goto('mas', null)">${ICONS.chevron} ${t('back_mas')}</div>`;
  }

  let contentHtml = '';
  let headerHtml = '';
  {
    const langBtn = screenKey==='inicio' ? renderLangToggle() : '';
    const printBtn = (screenKey!=='mas' && screenKey!=='sync') ? `<button class="printbtn" onclick="App.printSection('${screenKey}')" title="${esc(t('btn_print'))}">${ICONS.printer}</button>` : '';
    headerHtml = `<header class="top">${backRow}<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">${printBtn}${langBtn}</div></div><div class="rule"></div></header>`;
    if (screenKey==='inicio') contentHtml = renderInicio();
    else if (screenKey==='semana') contentHtml = renderSemana();
    else if (screenKey==='habitos') contentHtml = renderHabitos();
    else if (screenKey==='mas') contentHtml = renderMas();
    else if (screenKey==='finanzas') contentHtml = renderFinanzas();
    else if (screenKey==='proyectos') contentHtml = renderProyectos();
    else if (screenKey==='objetivos') contentHtml = renderObjetivos();
    else if (screenKey==='compras') contentHtml = renderCompras();
    else if (screenKey==='turnos') contentHtml = renderTurnos();
    else if (screenKey==='comidas') contentHtml = renderComidas();
    else if (screenKey==='sync') contentHtml = renderSync();
    else if (screenKey==='notas') contentHtml = renderNotasRich();
    else if (screenKey==='buscar') contentHtml = renderBuscar();
  }

  app.innerHTML = `
    ${headerHtml}
    <main id="main">${contentHtml}</main>
    ${renderTabBar()}
  `;
  if (focoInfo){
    const de_nuevo = document.getElementById(focoInfo.id);
    if (de_nuevo && (de_nuevo.tagName === 'INPUT' || de_nuevo.tagName === 'TEXTAREA')){
      de_nuevo.focus();
      try{ de_nuevo.setSelectionRange(focoInfo.start, focoInfo.end); }catch(e){}
    }
  }
  if (['inicio','notas','semana','proyectos','turnos','comidas'].includes(screenKey)){
    document.querySelectorAll('.richink').forEach(c => initRichInk(c.dataset.key));
  }
}

/* ---------- SEMANA ---------- */
/* Cada día se guarda por su FECHA real (ej. semana_2026-08-17), no por el nombre del día.
   Así la semana que viene no pisa lo de esta y queda historial. */
const DIA_SLUGS = {Lunes:'lunes',Martes:'martes','Miércoles':'miercoles',Jueves:'jueves',Viernes:'viernes','Sábado':'sabado',Domingo:'domingo'};
let semanaOffset = 0;   // 0 = período actual, -1 = el anterior, 1 = el siguiente
let openDayIdx = null;  // índice del día abierto dentro del rango visible
/* Cuántos días se muestran a la vez: 7, 14 o 30. Queda guardado en este dispositivo. */
let vistaDias = DB.get('vistaDias', 7);

function isoFecha(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function lunesDe(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay()+6) % 7));   // getDay(): 0=domingo
  return x;
}
function lunesVisible(){
  const l = lunesDe(new Date());
  /* El salto de las flechas es del tamaño del período que estés viendo:
     7 días saltan una semana, 30 días saltan un mes. */
  l.setDate(l.getDate() + semanaOffset*vistaDias);
  return l;
}
function diasDeLaSemana(){
  const l = lunesVisible();
  return Array.from({length:vistaDias}, (_,i) => { const d = new Date(l); d.setDate(l.getDate()+i); return d; });
}
function claveDia(fecha){ return 'semana_' + isoFecha(fecha); }
function rotuloSemana(){
  const ds = diasDeLaSemana(), a = ds[0], b = ds[ds.length-1];
  const loc = state.lang==='en' ? 'en-US' : 'es-AR';
  const mes = d => d.toLocaleDateString(loc, { month:'short' }).replace('.','');
  const mismoMes = a.getMonth() === b.getMonth();
  return mismoMes
    ? `${a.getDate()} – ${b.getDate()} ${mes(b)} ${b.getFullYear()}`
    : `${a.getDate()} ${mes(a)} – ${b.getDate()} ${mes(b)} ${b.getFullYear()}`;
}
function rotuloDia(fecha){
  /* Antes salía del índice (que solo servía para semanas de lunes a domingo).
     Ahora sale de la fecha, así funciona igual con 7, 14 o 30 días. */
  const nombre = DIAS[(fecha.getDay()+6) % 7];
  const loc = state.lang==='en' ? 'en-US' : 'es-AR';
  const mes = fecha.toLocaleDateString(loc, { month:'short' }).replace('.','');
  return vistaDias > 7
    ? dayLabel(nombre) + ' ' + fecha.getDate() + ' ' + mes
    : dayLabel(nombre) + ' ' + fecha.getDate();
}

/* Traslada lo que estaba guardado por nombre de día (semana_lunes, semana_martes, …)
   a las fechas de la semana en curso. Corre una sola vez. */
function migrarSemanaAFechas(){
  if (DB.get('semanaPorFechas', false)) return;
  const l = lunesDe(new Date());
  DIAS.forEach((dia, i) => {
    const viejo = DB.get('rich_semana_' + DIA_SLUGS[dia], null);
    if (!viejo || (!viejo.html && !viejo.drawing)) return;
    const f = new Date(l); f.setDate(l.getDate()+i);
    const nuevaClave = 'rich_' + claveDia(f);
    if (DB.get(nuevaClave, null)) return;      // ya hay algo escrito ahí: no lo tocamos
    if (!state.richContent) state.richContent = {};
    state.richContent[claveDia(f)] = viejo;
    DB.set(nuevaClave, viejo);
  });
  const enfoqueViejo = state.semana.enfoque;
  if (enfoqueViejo){
    if (!state.semana.enfoques) state.semana.enfoques = {};
    if (!state.semana.enfoques[isoFecha(l)]) state.semana.enfoques[isoFecha(l)] = enfoqueViejo;
    DB.set('semana', state.semana);
  }
  DB.set('semanaPorFechas', true);
}

function renderSemana(){
  migrarSemanaAFechas();
  const d = state.semana;
  if (!d.enfoques) d.enfoques = {};
  const ds = diasDeLaSemana();
  const claveSem = isoFecha(ds[0]);
  const hoy = isoFecha(new Date());
  if (openDayIdx === null){
    const i = ds.findIndex(f => isoFecha(f) === hoy);
    openDayIdx = i >= 0 ? i : 0;
  }
  return `
    <div id="richToolbarWrap" class="richtoolbar">${renderRichToolbar()}</div>
    <div class="semana-nav">
      <button class="semnavbtn" onclick="App.moverSemana(-1)" title="Semana anterior">‹</button>
      <div class="semana-nav-mid">
        <b>${esc(rotuloSemana())}</b>
        <span class="fechapick" title="Ir a una fecha">
          📅
          <input type="date" value="${isoFecha(ds[0])}" onchange="App.irAFecha(this.value)"/>
        </span>
        ${semanaOffset !== 0 ? `<button class="semhoybtn" onclick="App.semanaHoy()">${state.lang==='en'?'Today':'Hoy'}</button>` : ''}
      </div>
      <button class="semnavbtn" onclick="App.moverSemana(1)" title="Período siguiente">›</button>
    </div>
    <div class="vista-sel">
      ${[7,14,30].map(n => `<button class="vistabtn ${vistaDias===n?'on':''}" onclick="App.setVistaDias(${n})">${n} ${state.lang==='en'?'days':'días'}</button>`).join('')}
    </div>
    <div class="card">
      <div class="card-b">
        <label style="font-size:11px;font-weight:700;">${esc(t('card_enfoque'))}</label>
        <input type="text" value="${esc(d.enfoques[claveSem]||'')}" placeholder="${esc(t('ph_enfoque'))}" style="border-bottom:1px solid var(--mintLine);padding-bottom:6px;margin-top:6px;" oninput="App.setEnfoqueSemana('${claveSem}', this.value)"/>
      </div>
    </div>
    <div class="semana-grid">
    ${ds.map((fecha, i)=>{
      const tint = (fecha.getDay()===0 || fecha.getDay()===6) ? 'terracota' : '';
      const isOpen = openDayIdx === i;
      const esHoy = isoFecha(fecha) === hoy;
      const key = claveDia(fecha);
      const label = rotuloDia(fecha);
      return `
      <div class="card ${tint} ${isOpen?'dia-abierto':''} ${esHoy?'dia-hoy':''}">
        <div class="card-h" style="cursor:pointer" onclick="App.toggleDay(${i})">
          <span>${esc(label.toUpperCase())}</span>
          <span style="display:flex;align-items:center;gap:6px;">
            ${isOpen ? `<span class="fechapick movepick" title="Mover esta nota a otra fecha" onclick="event.stopPropagation()">↪<input type="date" onclick="event.stopPropagation()" onchange="App.moverNota('${isoFecha(fecha)}', this.value)"/></span>` : ''}
            <button class="card-h-printbtn" onclick="event.stopPropagation();App.printCard('dia_${isoFecha(fecha)}')" title="${esc(t('btn_print'))}">${ICONS.printer}</button>
            <span class="daychevron" style="transform:rotate(${isOpen?'90':'-90'}deg);display:flex;">${ICONS.chevron}</span>
          </span>
        </div>
        ${isOpen ? richBoxOnly(key, label, t('ph_dia_notas')) : ''}
      </div>`;
    }).join('')}
    </div>
  `;
}

/* ---------- HÁBITOS ---------- */
/* Mes que se está mirando en Hábitos. 0 = este mes, -1 = el anterior. */
let habitosOffset = 0;
let habitoArrastrado = null;   // índice del hábito que se está arrastrando
function mesVisible(){
  const h = new Date();
  return new Date(h.getFullYear(), h.getMonth() + habitosOffset, 1);
}
function rotuloMes(){
  const loc = state.lang==='en' ? 'en-US' : 'es-AR';
  const m = mesVisible().toLocaleDateString(loc, { month:'long', year:'numeric' });
  return m.charAt(0).toUpperCase() + m.slice(1);
}

/* Antes las marcas se guardaban por número de día suelto (1..31), sin mes: al cambiar de
   mes aparecían tildados los días del mes anterior y al tocarlos se sobrescribían.
   Ahora la clave es la fecha completa. Esto traslada lo viejo al mes en curso, una sola vez. */
function migrarHabitosAMeses(){
  if (DB.get('habitosPorFechas', false)) return;
  const h = new Date(), y = h.getFullYear(), m = h.getMonth();
  (state.habitos.lista || []).forEach(hab => {
    const nuevas = {};
    Object.keys(hab.marcas || {}).forEach(k => {
      if (/^\d{1,2}$/.test(k)){
        if (hab.marcas[k]) nuevas[isoFecha(new Date(y, m, Number(k)))] = true;
      } else {
        nuevas[k] = hab.marcas[k];
      }
    });
    hab.marcas = nuevas;
  });
  DB.set('habitos', state.habitos);
  DB.set('habitosPorFechas', true);
}

function renderHabitos(){
  migrarHabitosAMeses();
  const base = mesVisible();
  const y = base.getFullYear(), m = base.getMonth();
  const cantidad = new Date(y, m+1, 0).getDate();       // días que tiene ese mes
  const dias = Array.from({length:cantidad}, (_,i) => new Date(y, m, i+1));
  const hoyIso = isoFecha(new Date());
  return `
    <div class="semana-nav">
      <button class="semnavbtn" onclick="App.moverMes(-1)" title="Mes anterior">‹</button>
      <div class="semana-nav-mid">
        <b>${esc(rotuloMes())}</b>

/* Notas usa el sistema de texto enriquecido — una sola caja para escribir, dibujar, stickers e imágenes */
/* Cartelito de "Guardado" que aparece un segundo cuando algo se graba.
   La app siempre guardó sola, pero no se veía, y daba la sensación de que no lo hacía. */
let avisoTimer = null;
function avisoGuardado(){
  let el = document.getElementById('avisoGuardado');
  if (!el){
    el = document.createElement('div');
    el.id = 'avisoGuardado';
    el.className = 'avisoguardado';
    el.textContent = '✓ Guardado';
    document.body.appendChild(el);
  }
  el.classList.add('visible');
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => el.classList.remove('visible'), 1400);
}

let notaAbierta = null;

/* Antes las Notas eran un único recuadro sin fin (r_notas): todo se apilaba en la misma
   hoja, sin título ni fecha, y no había forma de separar una nota de otra ni de borrarlas.
   Esto convierte lo que ya estaba escrito en la primera nota de la lista, una sola vez. */
function migrarNotasAFichas(){
  if (DB.get('notasEnFichas', false)) return;
  const viejo = DB.get('rich_r_notas', null);
  if (viejo && (viejo.html || viejo.drawing)){
    const id = uid();
    state.notas.lista.push({ id, titulo:'Mis notas', fecha: isoFecha(new Date()) });
    state.richContent = state.richContent || {};
    state.richContent['nota_'+id] = viejo;
    DB.set('rich_nota_'+id, viejo);
    DB.set('notas', state.notas);
  }
  DB.set('notasEnFichas', true);
}

/* ---------- OBJETIVOS ---------- */
/* Objetivos pasó de ser 4 categorías fijas (personal/trabajo/bienestar/dinero) a una lista
   a la que se le pueden agregar y sacar categorías propias. Las 4 originales quedan con su
   'clave' para que sigan traduciéndose al cambiar de idioma; las nuevas guardan su nombre. */
function migrarObjetivosALista(){
  const actual = state.objetivos || {};
  /* 'sembrado' marca que las 4 categorías originales ya se crearon. Sin esa marca, una lista
     vacía se confundiría con "recién instalado" y volverían a aparecer las que borraste. */
  if (Array.isArray(actual.lista) && actual.sembrado) return;
  const viejos = actual;
  const lista = ['personal','trabajo','bienestar','dinero'].map(clave => {
    const o = viejos[clave] || {};
    return { id: uid(), clave, nombre:'', meta:o.meta||'', paso:o.paso||'', fecha:o.fecha||'' };
  });
  state.objetivos = { lista: (Array.isArray(actual.lista) && actual.lista.length) ? actual.lista : lista, sembrado: true };
  DB.set('objetivos', state.objetivos);
}
function nombreObjetivo(o){ return o.clave ? t('cat_'+o.clave) : (o.nombre || ''); }

/* ---------- TURNOS ---------- */
let verVencidos = false;   // si se muestran los turnos que ya pasaron
function renderTurnos(){
  /* Antes salían en el orden en que se habían cargado: el turno de pasado mañana podía
     quedar debajo de uno de dentro de dos meses. Ahora van por fecha y hora, y los que
     ya pasaron se van al final en vez de estorbar arriba. */
  const ahora = isoFecha(new Date());
  const vencidos = state.turnos.lista.filter(x => x.fecha && x.fecha < ahora);
  const vigentes = state.turnos.lista.filter(x => !(x.fecha && x.fecha < ahora));
  /* Los vencidos quedan plegados: siguen guardados, pero no estorban arriba de la lista. */
  const visibles = verVencidos ? state.turnos.lista : vigentes;
  const turnosList = visibles.slice().sort((a,b) => {
    const fa = (a.fecha||'9999-99-99') + ' ' + (a.hora||'99:99');
    const fb = (b.fecha||'9999-99-99') + ' ' + (b.hora||'99:99');
    const pa = (a.fecha && a.fecha < ahora) ? 1 : 0;
    const pb = (b.fecha && b.fecha < ahora) ? 1 : 0;
    if (pa !== pb) return pa - pb;
    return fa.localeCompare(fb);
  });
  const notifOn = ('Notification' in window) && Notification.permission === 'granted';
  return `
    <div id="richToolbarWrap" class="richtoolbar">${renderRichToolbar()}</div>
    ${!notifOn ? `
      <button class="notifbanner" onclick="App.enableNotifications()">
        ${ICONS.bell} ${esc(t('btn_activar_recordatorios'))}
      </button>
    ` : ''}
    ${vencidos.length ? `
      <button class="limpiarbtn" style="margin-top:0;margin-bottom:12px;" onclick="App.toggleVencidos()">

/* ---------- COMIDAS ---------- */
/* Semana que se está mirando en Comidas (independiente de la de la pantalla Semana). */
let comidasOffset = 0;
function semanaComidas(){
  const l = lunesDe(new Date());
  l.setDate(l.getDate() + comidasOffset*7);
  return Array.from({length:7}, (_,i) => { const d = new Date(l); d.setDate(l.getDate()+i); return d; });
}
function rotuloComidas(){
  const ds = semanaComidas(), a = ds[0], b = ds[6];
  const loc = state.lang==='en' ? 'en-US' : 'es-AR';
  const mes = d => d.toLocaleDateString(loc, { month:'short' }).replace('.','');
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()} – ${b.getDate()} ${mes(b)}`
    : `${a.getDate()} ${mes(a)} – ${b.getDate()} ${mes(b)}`;
}

/* Igual que pasaba con la Semana: los menús se guardaban por nombre de día fijo
   (comida_lunes, comida_martes…) y se pisaban todas las semanas. Ahora van por fecha.
   Esto traslada lo que ya estaba escrito a la semana en curso, una sola vez. */
function migrarComidasAFechas(){
  if (DB.get('comidasPorFechas', false)) return;
  const l = lunesDe(new Date());
  DIAS.forEach((dia, i) => {
    const viejo = DB.get('rich_comida_' + DIA_SLUGS[dia], null);
    if (!viejo || (!viejo.html && !viejo.drawing)) return;
    const f = new Date(l); f.setDate(l.getDate()+i);
    const nuevaClave = 'comida_' + isoFecha(f);
    if (DB.get('rich_' + nuevaClave, null)) return;   // ya hay algo ahí: no lo tocamos
    if (!state.richContent) state.richContent = {};
    state.richContent[nuevaClave] = viejo;
    DB.set('rich_' + nuevaClave, viejo);
  });
  DB.set('comidasPorFechas', true);
}

function renderComidas(){
  migrarComidasAFechas();
  const ds = semanaComidas();
  const hoy = isoFecha(new Date());
  return `
    <div id="richToolbarWrap" class="richtoolbar">${renderRichToolbar()}</div>
    <div class="semana-nav">
      <button class="semnavbtn" onclick="App.moverComidas(-1)" title="Semana anterior">‹</button>
      <div class="semana-nav-mid">
        <b>${esc(rotuloComidas())}</b>
        ${comidasOffset !== 0 ? `<button class="semhoybtn" onclick="App.comidasHoy()">${state.lang==='en'?'Today':'Hoy'}</button>` : ''}
      </div>
      <button class="semnavbtn" onclick="App.moverComidas(1)" title="Semana siguiente">›</button>
    </div>
    <div class="semana-grid">
    ${ds.map((fecha)=>{
      const key = 'comida_' + isoFecha(fecha);
      const tint = (fecha.getDay()===0 || fecha.getDay()===6) ? 'terracota' : '';
      const esHoy = isoFecha(fecha) === hoy;
      const label = rotuloDia(fecha);
      return `
      <div class="card ${tint} ${esHoy?'dia-hoy':''}">
        <div class="card-h"><span>${esc(label.toUpperCase())}</span></div>
        ${richBoxOnly(key, label, t('ph_comida'))}
      </div>`;
    }).join('')}
    </div>
  `;
}

/* ---------- BUSCAR ---------- */
let buscarTexto = '';

/* Convierte el HTML de una nota en texto plano, para poder buscar adentro
   sin que las etiquetas ensucien el resultado. */
function soloTexto(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
function sinTildes(x){
  return (x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function fechaLinda(iso){
  const [y,m,d] = iso.split('-').map(Number);
  if (!y) return iso;
  const f = new Date(y, m-1, d);
  const loc = state.lang==='en' ? 'en-US' : 'es-AR';
  const dia = DIAS[(f.getDay()+6) % 7];
  const mes = f.toLocaleDateString(loc, { month:'short' }).replace('.','');
  return dayLabel(dia) + ' ' + d + ' ' + mes + ' ' + y;
}

/* Devuelve, para cada clave guardada, dónde vive y cómo se llama, para poder
   mostrar el resultado y llevar a la persona hasta ahí. */
function ubicacionDe(clave){
  if (clave.indexOf('semana_') === 0){
    const iso = clave.slice(7);
    return { zona:'Semana', titulo: fechaLinda(iso), ir: `App.buscarIrASemana('${iso}')` };
  }
  if (clave.indexOf('comida_') === 0){
    const iso = clave.slice(7);
    return { zona:'Comidas', titulo: fechaLinda(iso), ir: `App.buscarIrAComidas('${iso}')` };
  }
  if (clave.indexOf('turno_') === 0){
    const id = clave.slice(6);
    const it = (state.turnos.lista || []).find(x => x.id === id);
    return { zona:'Turnos', titulo: (it && it.titulo) || 'Turno', ir: `App.goto('mas','turnos')` };
  }
  if (clave.indexOf('r_inicio_') === 0) return { zona:'Inicio', titulo:'Notas de hoy', ir:`App.goto('inicio')` };
  if (clave.indexOf('nota_') === 0){
    const id = clave.slice(5);
    const n = (state.notas.lista || []).find(x => x.id === id);
    if (n) return { zona:'Notas', titulo: (n.titulo || 'Sin título'), ir:`App.abrirNotaDesdeBuscar('${id}')` };
  }
  if (clave.indexOf('notas') === 0 || clave.indexOf('r_notas') === 0)
    return { zona:'Notas', titulo:'Notas', ir:`App.goto('mas','notas')` };
  if (clave.indexOf('proyecto_') === 0) return { zona:'Proyectos', titulo:'Proyecto', ir:`App.goto('mas','proyectos')` };
  return { zona:'Otros', titulo: clave, ir:`App.goto('mas', null)` };
}

function buscarResultados(q){
  const aguja = sinTildes(q);
  if (aguja.length < 2) return [];
  const out = [];

  /* 1) notas con formato (días, comidas, turnos, notas sueltas) */
  const vistas = {};
  const revisar = (clave, obj) => {
    if (!obj || vistas[clave]) return;
    vistas[clave] = true;
    const txt = soloTexto(obj.html);
    if (!txt) return;
    const pos = sinTildes(txt).indexOf(aguja);
    if (pos === -1) return;
    const desde = Math.max(0, pos - 40);
    const frag = (desde > 0 ? '…' : '') + txt.slice(desde, pos + q.length + 90) + (txt.length > pos + q.length + 90 ? '…' : '');
    out.push(Object.assign({ fragmento: frag }, ubicacionDe(clave)));
  };
  Object.keys(state.richContent || {}).forEach(k => revisar(k, state.richContent[k]));
  try{
    for (let i = 0; i < localStorage.length; i++){
      const lk = localStorage.key(i);
      if (lk && lk.indexOf('planner:rich_') === 0){
        const clave = lk.slice(13);
        if (!vistas[clave]) revisar(clave, DB.get('rich_' + clave, null));
      }
    }
  }catch(e){}

  /* 2) campos de texto sueltos de las otras secciones */
  const sueltos = [
    ['Inicio', 'Hoy', state.inicio.hoy, `App.goto('inicio')`],
    ['Inicio', 'Recordatorios', state.inicio.recordatorios, `App.goto('inicio')`],
  ];
  (state.inicio.prioridades || []).forEach(p => sueltos.push(['Inicio','Prioridad',p.text,`App.goto('inicio')`]));
  (state.compras.lista || []).forEach(c => sueltos.push(['Compras','Lista',c.text,`App.goto('mas','compras')`]));
  (state.habitos.lista || []).forEach(h => sueltos.push(['Hábitos','Hábito',h.nombre,`App.goto('habitos')`]));
  (state.proyectos.lista || []).forEach(p => sueltos.push(['Proyectos', p.nombre||'Proyecto', p.nombre, `App.goto('mas','proyectos')`]));
  (state.turnos.lista || []).forEach(x => sueltos.push(['Turnos', x.titulo||'Turno', x.titulo, `App.goto('mas','turnos')`]));
  Object.keys(state.semana.enfoques || {}).forEach(k =>
    sueltos.push(['Semana', 'Enfoque · ' + fechaLinda(k), state.semana.enfoques[k], `App.buscarIrASemana('${k}')`]));
  ((state.objetivos && state.objetivos.lista) || []).forEach(o => {
    sueltos.push(['Objetivos', nombreObjetivo(o) || 'Categoría', [o.meta, o.paso].filter(Boolean).join(' · '), `App.goto('mas','objetivos')`]);
  });

  sueltos.forEach(([zona, titulo, texto, ir]) => {
    if (!texto) return;
    if (sinTildes(texto).indexOf(aguja) === -1) return;
    out.push({ zona, titulo, fragmento: texto.slice(0, 140), ir });
  });

  return out;
}

function renderBuscar(){
  const res = buscarResultados(buscarTexto);
  const corta = buscarTexto.trim().length < 2;
  return `
    <div class="card">
      <div class="card-b">

        : `<p style="font-size:12px;color:var(--sub);margin:2px 0 10px;">${res.length} resultado${res.length===1?'':'s'}</p>
           ${res.map(r => `

  `;
}

/* Caja de tarjeta simple (sin lienzo/pizarra — ese sistema fue reemplazado por el de texto enriquecido) */

  return `

      <div class="${cls}">${content}</div>

  `;
}

function getRich(key){
  if (!state.richContent) state.richContent = {};
  if (!state.richContent[key]) state.richContent[key] = DB.get('rich_'+key, { html:'', drawing:null });
  return state.richContent[key];
}
function saveRich(key){ DB.set('rich_'+key, state.richContent[key]); }

function richCard(title, key, placeholder, tint, printKey){
  const data = getRich(key);
  const printBtn = printKey ? `<button class="card-h-printbtn" onclick="App.printCard('${printKey}')" title="${esc(t('btn_print'))}">${ICONS.printer}</button>` : '';
  return `
    <div class="card${tint?' '+tint:''}">
      <div class="card-h"><span>${esc(title)}</span>${printBtn}</div>
      ${richBoxOnly(key, title, placeholder)}
    </div>
  `;
}

/* Igual que richCard pero sin el header propio — para usarla dentro de una tarjeta que ya tiene su propio título (ej. cada día en Semana) */
function richBoxOnly(key, title, placeholder){
  const data = getRich(key);
  return `
    <div class="card-b" style="padding-top:12px;">
      <div class="richbox">
        <div class="richtext" contenteditable="true" id="richtext-${key}" data-key="${key}" data-placeholder="${esc(placeholder)}"
             onfocus="RichText.setActive('${key}','${esc(title)}')"
             onclick="RichText.handleBoxClick(event)"
             oninput="RichText.persist('${key}')">${data.html}</div>
        <canvas class="richink" id="richink-${key}" data-key="${key}"></canvas>
      </div>
    </div>
  `;
}

function renderStickerGridItems(){
  const q = richStickerSearch.trim().toLowerCase();
  const filtered = !q ? RICH_STICKERS : RICH_STICKERS.filter(s => (STICKER_KEYWORDS[s]||'').includes(q));
  if (!filtered.length){
    return `<p style="grid-column:1/-1;font-size:12.5px;color:var(--sub);text-align:center;padding:10px 0;">${state.lang==='en'?'No matches — paste any emoji above and tap Insert.':'Sin resultados — pegá cualquier emoji arriba y tocá Insertar.'}</p>`;
  }
  return filtered.map(s=>`<button onmousedown="event.preventDefault()" onclick="RichText.insertSticker('${s}')">${s}</button>`).join('');
}
function renderStickerInsertBtn(){
  const emojiMatch = richStickerSearch.match(/\p{Extended_Pictographic}/u);
  if (!emojiMatch) return '';
  return `<button class="dashedbtn" style="margin-top:0;margin-bottom:10px;font-size:15px;" onmousedown="event.preventDefault()" onclick="RichText.insertPastedSticker()">${state.lang==='en'?'Insert':'Insertar'} ${emojiMatch[0]}</button>`;
}

function refreshRichToolbar(){
  const wrap = document.getElementById('richToolbarWrap');
  if (wrap) wrap.innerHTML = renderRichToolbar();
  document.querySelectorAll('.richink').forEach(c=>{
    c.classList.toggle('active', richPanel==='pen' && c.dataset.key===richActive);
  });
  if (richPanel==='pen' && richActive) initRichInk(richActive);
}

const RichText = {
  setActive(key, title){
    richActive = key;
    richActiveTitle = title;
    refreshRichToolbar();
  },
  persist(key){
    const el = document.getElementById('richtext-'+key);
    if (!el) return;
    getRich(key).html = el.innerHTML;
    saveRich(key);
    avisoGuardado();
  },
  focusActive(){
    /* Si richActive quedó apuntando a una caja que ya no está en pantalla (o nunca se tocó),
       lo reapuntamos a la única caja visible. Sin esto, insertar una imagen en un día que
       todavía no se tocó no guarda nada, porque persist() sale antes de escribir. */
    let el = richActive ? document.getElementById('richtext-'+richActive) : null;
    if (!el){
      const boxes = document.querySelectorAll('.richtext');
      if (boxes.length !== 1) return;
      el = boxes[0];
      richActive = el.dataset.key;
      richActiveTitle = '';
    }
    el.focus();
  },
  command(cmd, value){
    this.focusActive();
    document.execCommand(cmd, false, value);
    this.persist(richActive);
  },
  insertSticker(s){
    this.focusActive();
    document.execCommand('insertText', false, s);
    this.persist(richActive);
  },
  updateGifLink(q){
    const a = document.getElementById('gifOpenLink');
    if (!a) return;
    a.href = q.trim() ? `https://giphy.com/search/${encodeURIComponent(q.trim())}` : 'https://giphy.com/trending-gifs';
  },
  insertGif(){
    const input = document.getElementById('gifUrlInput');
    const errEl = document.getElementById('gifError');
    const url = input ? input.value.trim() : '';
    if (errEl) errEl.textContent = '';
    if (!url){
      if (errEl) errEl.textContent = state.lang==='en' ? 'Paste a link first.' : 'Pegá un link primero.';
      return;
    }
    if (!/^https?:\/\//i.test(url)){
      if (errEl) errEl.textContent = state.lang==='en' ? 'That doesn\'t look like a valid link.' : 'Eso no parece un link válido.';
      return;
    }
    this.focusActive();
    document.execCommand('insertHTML', false, `<img src="${esc(url)}" alt="GIF" style="max-width:100%;"/>`);
    this.persist(richActive);
    if (input) input.value = '';
  },
  setStickerSearch(v){
    richStickerSearch = v;
    const grid = document.getElementById('stickerGrid');
    const insertArea = document.getElementById('stickerInsertArea');
    if (grid) grid.innerHTML = renderStickerGridItems();
    if (insertArea) insertArea.innerHTML = renderStickerInsertBtn();
  },
  insertPastedSticker(){
    const match = richStickerSearch.match(/\p{Extended_Pictographic}/u);
    if (!match) return;
    this.insertSticker(match[0]);
    richStickerSearch = '';
    const input = document.getElementById('stickerSearchInput');
    if (input) input.value = '';
    const grid = document.getElementById('stickerGrid');
    const insertArea = document.getElementById('stickerInsertArea');
    if (grid) grid.innerHTML = renderStickerGridItems();
    if (insertArea) insertArea.innerHTML = '';
  },
  applyFont(family){ this.command('fontName', family); },
  applySize(px){
    this.focusActive();
    document.execCommand('fontSize', false, '7');
    const root = document.getElementById('richtext-'+richActive);
    root?.querySelectorAll('font[size="7"]').forEach(node=>{
      node.removeAttribute('size');
      node.style.fontSize = px+'px';
    });
    this.persist(richActive);
  },
  customTextColor(v){ richCustomTextColor = v; this.command('foreColor', v); },
  customHighlightColor(v){ richCustomHighlightColor = v; this.command('backColor', v); },
  /* Inserta HTML en la caja activa SIN usar execCommand.
     execCommand('insertHTML') depende de que el cursor siga adentro del recuadro; al abrir
     el selector de archivos del celular se pierde esa selección y la imagen terminaba
     insertándose en la nada. Acá la metemos directo en el DOM, que siempre funciona. */
  insertHtmlInActive(html){
    this.focusActive();
    const target = richActive ? document.getElementById('richtext-'+richActive) : null;
    if (!target){
      alert('No encontré en qué nota insertar. Tocá primero dentro del recuadro del día y volvé a intentar.');
      return false;
    }
    const frag = document.createRange().createContextualFragment(html);
    const sel = window.getSelection();
    let range = null;
    if (sel && sel.rangeCount){
      const r = sel.getRangeAt(0);
      if (target.contains(r.commonAncestorContainer)) range = r;
    }
    if (range){ range.deleteContents(); range.insertNode(frag); }
    else { target.appendChild(frag); }
    this.persist(richActive);
    return true;
  },
  insertImage(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (file.type === 'image/gif'){
      /* los GIF se insertan tal cual, sin recomprimir, para no perder la animación */
      if (file.size > 1.5*1024*1024){
        const ok = confirm(state.lang==='en'
          ? 'This GIF is quite heavy and may fail to sync. Insert it anyway?'
          : 'Este GIF pesa bastante y puede fallar al sincronizar. ¿Lo insertás igual?');
        if (!ok) return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        RichText.insertHtmlInActive(`<img src="${e.target.result}" alt="GIF" class="rt-img" onclick="RichText.selectImage(event,this)"/>`);
      };
      reader.readAsDataURL(file);
      evt.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        /* Antes: 900px y calidad 0.75, que daba fotos de 300-500 KB en base64.
           Firestore rechaza cualquier documento de más de 1 MB, así que la nota del día
           con foto no se llegaba a subir nunca y al recargar volvía la versión vieja sin imagen.
           Con 900px y calidad 0.78 una foto/placa queda en torno a 150-200 KB: entra
           holgada en la nube y el texto de las placas sigue leyéndose al ampliarla. */
        const maxDim = 900;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){ const r = Math.min(maxDim/w, maxDim/h); w=Math.round(w*r); h=Math.round(h*r); }
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl = c.toDataURL('image/jpeg', 0.78);
        RichText.insertHtmlInActive(`<img src="${dataUrl}" alt="Imagen" class="rt-img" onclick="RichText.selectImage(event,this)"/>`);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    evt.target.value = '';
  },
  selectImage(evt, img){
    if (evt) evt.stopPropagation();
    document.querySelectorAll('.rt-img-selected').forEach(el => el.classList.remove('rt-img-selected'));
    img.classList.add('rt-img', 'rt-img-selected');
    richSelectedImage = img;
    dibujarMarco(img);
    refreshRichToolbar();
  },
  handleBoxClick(evt){
    if (evt.target && evt.target.tagName === 'IMG'){
      this.selectImage(evt, evt.target);
    } else {
      this.deselectImage();
    }
  },
  deselectImage(){
    if (richSelectedImage){
      richSelectedImage.classList.remove('rt-img-selected');
      richSelectedImage = null;
      borrarMarco();
      refreshRichToolbar();
    }
  },
  moveImageUp(){

  moveImageDown(){

  /* Alterna entre miniatura (por defecto) e imagen grande dentro de la nota. */
  /* Cambia dónde se ubica la imagen dentro del recuadro. 'flota' hace que el texto
     se acomode al costado, y vuelve a alternar entre izquierda y derecha. */
  alignImage(donde){
    const img = richSelectedImage;
    if (!img) return;
    const clases = ['rt-izq','rt-der','rt-flota-izq','rt-flota-der'];
    const eraFlotaIzq = img.classList.contains('rt-flota-izq');
    clases.forEach(c => img.classList.remove(c));
    if (donde === 'izq')   img.classList.add('rt-izq');
    if (donde === 'der')   img.classList.add('rt-der');
    if (donde === 'flota') img.classList.add(eraFlotaIzq ? 'rt-flota-der' : 'rt-flota-izq');
    /* 'centro' no agrega nada: es el comportamiento por defecto. */
    this.persist(richActive);
    refreshRichToolbar();
  },
  /* Activa/desactiva el modo libre de una imagen. Con el modo activo se la agarra
     con el dedo, el mouse o el lápiz y se la suelta donde uno quiera. */
  toggleLibre(){
    const img = richSelectedImage;
    if (!img) return;
    if (img.classList.contains('rt-libre')){
      img.classList.remove('rt-libre');
      img.style.left = ''; img.style.top = '';
    } else {
      ['rt-izq','rt-der','rt-flota-izq','rt-flota-der'].forEach(c => img.classList.remove(c));
      img.classList.add('rt-libre');
      if (!img.style.left) img.style.left = '0px';
      if (!img.style.top)  img.style.top  = '0px';
      img.setAttribute('draggable','false');
    }
    this.persist(richActive);
    refreshRichToolbar();
  },
  /* Cambia el ancho de la imagen por un porcentaje. La altura va sola, para no deformarla. */
  escalarImagen(factor){
    const img = richSelectedImage;
    if (!img) return;
    const actual = img.getBoundingClientRect().width || 240;
    const caja = img.closest('.richtext');
    const contW = anchoInterno(caja);
    const nuevoPx = Math.max(30, Math.min(Math.round(actual * factor), contW));
    /* Se guarda en % del ancho del cuadro (no en píxeles fijos) para que se adapte
       sola al pasar de una pantalla ancha (PC) a una angosta (celu). */
    const pct = Math.max(8, Math.min(100, Math.round((nuevoPx / contW) * 100)));
    img.classList.add('rt-medida');
    img.classList.remove('rt-img-big');
    img.style.width = pct + '%';
    img.style.height = 'auto';
    this.persist(richActive);
    refreshRichToolbar();
  },

  medidaOriginal(){

  _blankRef(canvas){
    const b = document.createElement('canvas'); b.width=canvas.width; b.height=canvas.height;
    const bctx = b.getContext('2d'); bctx.fillStyle='#fff'; bctx.fillRect(0,0,b.width,b.height);
    return b;
  },
  saveInkSnapshot(){
    const canvas = document.getElementById('richink-'+richActive);
    if (!canvas) return;
    const data = canvas.toDataURL('image/png');
    if (!richDrawHistory[richActive]) richDrawHistory[richActive]=[];
    richDrawHistory[richActive].push(data);
    if (richDrawHistory[richActive].length>25) richDrawHistory[richActive].shift();
    richDrawFuture[richActive] = [];
    getRich(richActive).drawing = data;
    saveRich(richActive);
  },
  restoreDrawing(data){
    const canvas = document.getElementById('richink-'+richActive);
    const ctx = canvas?.getContext('2d');
    if (!canvas||!ctx) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (!data){ getRich(richActive).drawing=null; saveRich(richActive); return; }
    const img = new Image();
    img.onload = () => ctx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = data;
    getRich(richActive).drawing = data;
    saveRich(richActive);
  },
  undoDraw(){
    const h = richDrawHistory[richActive]; if (!h||!h.length) return;
    const cur = h.pop(); if (cur) (richDrawFuture[richActive]=richDrawFuture[richActive]||[]).push(cur);
    this.restoreDrawing(h[h.length-1]);
  },
  redoDraw(){
    const f = richDrawFuture[richActive]; const next = f?.pop(); if (!next) return;
    (richDrawHistory[richActive]=richDrawHistory[richActive]||[]).push(next);
    this.restoreDrawing(next);
  },
  clearDrawing(){
    const canvas = document.getElementById('richink-'+richActive);
    const ctx = canvas?.getContext('2d');
    if (canvas && ctx){ ctx.clearRect(0,0,canvas.width,canvas.height); getRich(richActive).drawing=null; saveRich(richActive); richDrawHistory[richActive]=[]; richDrawFuture[richActive]=[]; }
  },

  _prepareDrawingForOcr(source){
    const sctx = source.getContext('2d'); if (!sctx) return null;
    const pixels = sctx.getImageData(0,0,source.width,source.height);
    let minX=source.width,minY=source.height,maxX=-1,maxY=-1;
    for (let y=0;y<source.height;y++) for (let x=0;x<source.width;x++){
      const a = pixels.data[(y*source.width+x)*4+3];
      if (a>20){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    }
    if (maxX<minX||maxY<minY) return null;
    const margin=35;
    minX=Math.max(0,minX-margin); minY=Math.max(0,minY-margin);
    maxX=Math.min(source.width-1,maxX+margin); maxY=Math.min(source.height-1,maxY+margin);
    const w=maxX-minX+1, h=maxY-minY+1;
    const crop=document.createElement('canvas'); crop.width=w; crop.height=h;
    const cctx=crop.getContext('2d'); cctx.fillStyle='#fff'; cctx.fillRect(0,0,w,h);
    cctx.drawImage(source,minX,minY,w,h,0,0,w,h);
    const img=cctx.getImageData(0,0,w,h);
    for (let i=0;i<img.data.length;i+=4){
      const b=(img.data[i]+img.data[i+1]+img.data[i+2])/3; const ink=b<245;
      img.data[i]=ink?0:255; img.data[i+1]=ink?0:255; img.data[i+2]=ink?0:255; img.data[i+3]=255;
    }
    cctx.putImageData(img,0,0);
    const scale=3, out=document.createElement('canvas'); out.width=w*scale; out.height=h*scale;
    const octx=out.getContext('2d'); octx.fillStyle='#fff'; octx.fillRect(0,0,out.width,out.height);
    octx.imageSmoothingEnabled=false; octx.drawImage(crop,0,0,out.width,out.height);
    return out;
  },
  async recognizeHandwriting(){
    const canvas = document.getElementById('richink-'+richActive);
    if (!canvas) return;
    const prepared = this._prepareDrawingForOcr(canvas);
    if (!prepared){ alert('Primero escribí algo a mano dentro de la caja.'); return; }
    const btn = document.getElementById('richOcrBtn');
    const original = btn ? btn.innerHTML : '';
    if (btn) btn.innerHTML = 'Reconociendo…';
    try{
      const mod = await import('https://cdn.jsdelivr.net/npm/tesseract.js@6/+esm');
      const worker = await mod.createWorker('spa');
      await worker.setParameters({ tessedit_pageseg_mode: mod.PSM.SINGLE_BLOCK });
      const result = await worker.recognize(prepared.toDataURL('image/png'));
      await worker.terminate();
      const text = String(result?.data?.text||'').replace(/\s+/g,' ').trim();
      if (!text){ alert('No pude reconocer esa escritura. Probá con letras más separadas y claras.'); return; }
      const el = document.getElementById('richtext-'+richActive);
      if (el){ el.append(document.createTextNode((el.innerText.trim()?' ':'')+text)); this.persist(richActive); }
      this.clearDrawing();
      richPanel = null;
      refreshRichToolbar();
    }catch(e){
      console.warn('OCR error', e);
      alert('No se pudo cargar el reconocedor. Revisá tu conexión e intentá de nuevo.');
    } finally {
      if (btn && document.body.contains(btn)) btn.innerHTML = original;
    }
  }
};

function initRichInk(key){
  const canvas = document.getElementById('richink-'+key);
  const wrap = document.getElementById('richtext-'+key);
  if (!canvas || !wrap || canvas.dataset.inited) return;
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(rect.width,300) * dpr;
  canvas.height = Math.max(rect.height,110) * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap='round'; ctx.lineJoin='round';
  const saved = getRich(key).drawing;
  if (saved){
    const img = new Image();
    img.onload = () => ctx.drawImage(img,0,0,rect.width,rect.height);
    img.src = saved;
  }
  let drawing = false;
  const point = (e) => { const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left), y:(e.clientY-r.top)}; };
  canvas.addEventListener('pointerdown', (e)=>{
    if (!canvas.classList.contains('active')) return;
    drawing=true; canvas.setPointerCapture(e.pointerId);
    const p=point(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
  });
  canvas.addEventListener('pointermove', (e)=>{
    if (!drawing) return;
    const p=point(e);
    ctx.lineWidth = richEraser?18:richPenWidth;
    ctx.globalCompositeOperation = richEraser?'destination-out':'source-over';
    ctx.strokeStyle = richPenColor;
    ctx.lineTo(p.x,p.y); ctx.stroke();
  });
  const stop = ()=>{ if(!drawing) return; drawing=false; ctx.globalCompositeOperation='source-over'; RichText.saveInkSnapshot(); };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.dataset.inited = '1';
}

const App = {
  setLang(lang){
    state.lang = lang;

    document.documentElement.lang = lang;
    render();
  },
  goto(tab, masScreen){
    /* Si nos vamos de Notas, cerramos la nota abierta: si no, al volver aparecía
       la nota de adentro en vez de la lista, y parecía que se había perdido el resto. */
    if (tab !== 'notas' && !(tab === 'mas' && masScreen === 'notas')) notaAbierta = null;
    state.tab = tab;
    state.masScreen = (tab==='mas' && masScreen) ? masScreen : null;
    render();
  },
  toggleDay(i){ openDayIdx = (openDayIdx===i) ? null : i; render(); },
  moverSemana(n){ semanaOffset += n; openDayIdx = null; render(); },
  semanaHoy(){ semanaOffset = 0; openDayIdx = null; render(); },
  /* Salta directo a la fecha elegida y deja ese día abierto, sin tener que ir
     apretando las flechas una semana por vez. */
  irAFecha(iso){
    if (!iso) return;
    const [y, m, dd] = iso.split('-').map(Number);
    if (!y || !m || !dd) return;
    const destino = new Date(y, m-1, dd);
    const base = lunesDe(new Date());
    const diff = Math.round((destino - base) / 86400000);
    semanaOffset = Math.floor(diff / vistaDias);
    openDayIdx = diff - semanaOffset * vistaDias;
    render();
  },
  /* Mueve la nota entera (texto, imágenes y dibujo) de un día a otro, sin copiar y pegar.
     Si el día de destino ya tiene algo escrito, lo respeta y agrega la nota abajo. */
  moverNota(isoOrigen, isoDestino){
    if (!isoDestino || isoDestino === isoOrigen) return;
    const kO = 'semana_' + isoOrigen, kD = 'semana_' + isoDestino;
    const origen = getRich(kO);
    if (!origen || (!origen.html && !origen.drawing)){
      alert('Ese día no tiene nada para mover.');
      return;
    }
    const destino = getRich(kD);
    const ocupado = !!(destino && (destino.html || destino.drawing));
    const fmt = iso => { const [y,m,d] = iso.split('-'); return d+'/'+m; };
    const aviso = ocupado
      ? 'El día ' + fmt(isoDestino) + ' ya tiene una nota.\n\nLa nota del ' + fmt(isoOrigen) + ' se va a agregar abajo de la que ya está.\n\n¿Seguimos?'
      : '¿Mover la nota del ' + fmt(isoOrigen) + ' al ' + fmt(isoDestino) + '?';
    if (!confirm(aviso)) return;

    destino.html = ocupado && destino.html
      ? destino.html + '<br>' + (origen.html || '')
      : (origen.html || '');
    if (!destino.drawing && origen.drawing) destino.drawing = origen.drawing;
    saveRich(kD);

    origen.html = '';
    origen.drawing = null;
    saveRich(kO);

    richActive = null;
    this.irAFecha(isoDestino);
  },
  setVistaDias(n){
    vistaDias = n;
    DB.set('vistaDias', n);   // no se sincroniza: es una preferencia de este dispositivo
    semanaOffset = 0;
    openDayIdx = null;
    render();
  },
  setEnfoqueSemana(claveSem, valor){
    if (!state.semana.enfoques) state.semana.enfoques = {};
    state.semana.enfoques[claveSem] = valor;
    DB.set('semana', state.semana);
  },

  /* --- copia de seguridad --- */
  /* Claves guardadas que forman parte del planner (excluye configuración y marcas internas). */
  clavesDelPlanner(){
    /* Marcas internas de este dispositivo (claves de migración y preferencias de vista):
       no son datos del planner, no se exportan ni se suben. */
    const fuera = ['syncConfig','migratedToDocs','pendienteSubirTodo',
                   'semanaPorFechas','habitosPorFechas','comidasPorFechas','notasEnFichas','vistaDias'];
    const out = [];
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if (k && k.indexOf('planner:') === 0){
        const corta = k.slice(8);
        if (fuera.indexOf(corta) === -1) out.push(corta);
      }
    }
    return out;
  },
  exportarBackup(){
    const datos = {};
    this.clavesDelPlanner().forEach(k => { datos[k] = localStorage.getItem('planner:'+k); });
    const paquete = { app:'mi-planner-digital', version:1, fecha:new Date().toISOString(), datos };
    const blob = new Blob([JSON.stringify(paquete)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const f = new Date(), dd = n => String(n).padStart(2,'0');
    const a = document.createElement('a');
    a.href = url;
    a.download = `planner-${f.getFullYear()}-${dd(f.getMonth()+1)}-${dd(f.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  importarBackup(evt){
    const file = evt.target.files[0];
    evt.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      let paquete = null;
      try{ paquete = JSON.parse(e.target.result); }catch(err){}
      if (!paquete || paquete.app !== 'mi-planner-digital' || !paquete.datos){
        alert('Ese archivo no es una copia de este planner. Elegí el .json que bajaste con "Bajar copia".');
        return;
      }
      const claves = Object.keys(paquete.datos);
      const cuando = paquete.fecha ? new Date(paquete.fecha).toLocaleString('es-AR') : 'fecha desconocida';
      if (!confirm('Vas a reemplazar TODO lo que tenés ahora por la copia del ' + cuando +
                   ' (' + claves.length + ' secciones).\n\nEsto no se puede deshacer. ¿Seguimos?')) return;
      try{
        this.clavesDelPlanner().forEach(k => localStorage.removeItem('planner:'+k));
        claves.forEach(k => localStorage.setItem('planner:'+k, paquete.datos[k]));
      }catch(err){
        alert('No entró toda la copia: se quedó sin espacio el navegador.\n\n' + err);
        return;
      }
      /* Al recargar, la copia restaurada se sube a la nube; si no, la versión de la nube
         (la vieja) la pisaría de nuevo. */
      DB.set('pendienteSubirTodo', true);
      alert('Copia restaurada. La app se recarga ahora.');
      location.reload();
    };
    reader.readAsText(file);
  },

  /* Fuerza la subida de TODO lo que hay en este dispositivo al código actual.
     Necesario al cambiar de código: la nube nueva arranca vacía y el push normal
     solo se dispara cuando algo cambia. */
  subirTodo(){
    if (!Sync.db){ alert('Todavía no está conectado a la nube. Esperá unos segundos y probá de nuevo.'); return; }
    let n = 0;
    this.clavesDelPlanner().forEach(k => { if (isSyncKey(k)){ Sync.push(k); n++; } });
    alert('Subiendo ' + n + ' secciones a la nube. Esperá unos segundos y fijate que diga "Última sincronización".');
  },

  /* Panel de diagnóstico: muestra en pantalla dónde se corta la cadena

  diagnostico(){

    ov.appendChild(pre);

  moverEnLista(section, listKey, id, delta){

    const i = l.findIndex(x => x.id === id);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= l.length) return;
    const [it] = l.splice(i, 1);
    l.splice(j, 0, it);
    DB.set(section, state[section]);
    avisoGuardado();
    render();
  },

  borrarTildados(section, listKey){
    const l = state[section][listKey] || [];
    const n = l.filter(x => x.done).length;
    if (!n) return;
    if (!confirm('¿Borrar ' + n + (n === 1 ? ' ítem tildado?' : ' ítems tildados?') + '\n\nEsto no se puede deshacer.')) return;
    state[section][listKey] = l.filter(x => !x.done);
    DB.set(section, state[section]);
    avisoGuardado();

    if (!confirm('¿Borrar ' + n + (n === 1 ? ' paso tildado?' : ' pasos tildados?') + '\n\nEsto no se puede deshacer.')) return;

  /* --- sincronización entre dispositivos (Firebase, cuenta propia del usuario) --- */
  connectSync(){
    const raw = document.getElementById('fbConfigInput').value.trim();
    const code = document.getElementById('syncCodeInput').value.trim();
    if (!raw || !code){ alert('Completá la configuración de Firebase y un código.'); return; }
    let parsed;
    try{
      const jsonish = raw.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'');
      parsed = Function('"use strict"; return (' + jsonish + ')')();
    }catch(e){
      alert('No pude leer esa configuración. Pegá el objeto tal cual lo copiaste de Firebase.');
      return;
    }
    state.syncConfig = { firebaseConfig: parsed, code, rawConfig: raw };
    DB.set('syncConfig', state.syncConfig);
    render();
    Sync.start();
  },

    Sync.stop();
    state.syncConfig = null;
    DB.set('syncConfig', null);

function pText(html){
  if (!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.innerHTML;
}
function pEmpty(){ return `<p class="p-empty">—</p>`; }
function pRichBlock(key){
  const data = getRich(key);
  const hasText = data.html && data.html.trim() && data.html.trim() !== '<br>';
  const hasDrawing = !!data.drawing;
  if (!hasText && !hasDrawing) return pEmpty();
  return `${hasText?`<div class="p-rich">${pText(data.html)}</div>`:''}${hasDrawing?`<img class="p-drawing" src="${data.drawing}"/>`:''}`;
}
